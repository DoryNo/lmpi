# LMPI proxy configuration.
# Environment variables (LMPI_*) override these values:
#   LMPI_UPSTREAM_URL, LMPI_HOST, LMPI_PORT, LMPI_REQUEST_TIMEOUT,
#   LMPI_RATE_LIMIT_ENABLED, LMPI_RATE_LIMIT_RPM, LMPI_RATE_LIMIT_BURST,
#   LMPI_MAX_BODY_BYTES, LMPI_AUDIT_ENABLED, LMPI_AUDIT_PATH,
#   LMPI_AUDIT_INCLUDE_TEXT, LMPI_AUDIT_ACCESS_LOG,
#   LMPI_CONFIG_PATH (path to this file).
upstream_url: https://api.openai.com
host: 0.0.0.0
port: 8080
request_timeout: 300.0

# Fast path (stage 2): regex/heuristic jailbreak detection with noisy-OR
# scoring. Weights and thresholds are heuristics pending benchmark tuning.
# fast_path:
#   enabled: true
#   block_threshold: 0.75   # score >= this → HTTP 403
#   warn_threshold: 0.4     # score >= this < block → logged, forwarded
#
# Deep path (stage 3): ONNX DeBERTa prompt-injection classifier. Disabled
# until the model is downloaded: python scripts/download_model.py
# Thresholds are the v1.1 tuned defaults (tuning log: benchmarks/tuning_log.md):
# block lowered 0.75 -> 0.65 after a threshold sweep on the 60% tuning split.
# deep_path:
#   enabled: false                              # then set true
#   model_path: models/deberta-v3-base-prompt-injection-v2
#   block_threshold: 0.65   # injection prob >= this → HTTP 403
#   warn_threshold: 0.5     # >= this < block → logged, forwarded
#   max_chars: 6000         # cap on text handed to the classifier

# Canary tokens (final stage): HMAC canary injected into the system prompt
# and scanned for in responses to catch system prompt leakage. secret: HMAC
# key for token derivation — leave empty for an ephemeral per-process secret.
# canary:
#   enabled: true
#   action: redact          # redact (replace with [REDACTED]) | block (502)
#   secret: ""
#   add_missing_system: false  # add a system message when caller sent none

# Rate limiting (v1.1): per-client in-memory token bucket. Key = hash of the
# Authorization / API-key header when present, else the client IP. Single-
# process only (no Redis — roadmap v3.5). /health is never throttled.
# rate_limit:
#   enabled: true
#   requests_per_minute: 60   # sustained refill rate (LMPI_RATE_LIMIT_RPM)
#   burst: 20                 # bucket capacity / spike allowance

# Request-body cap (v1.1): bodies larger than this are rejected with
# HTTP 413 before parsing/forwarding (DoS hardening).
# max_body_bytes: 1048576   # 1 MiB

# Audit log (hardening v1.1): JSON-lines audit trail. One JSON object per
# line — detection decisions (request id, stage, action, scores, latency),
# canary leak alerts (fingerprint only) and, with access_log, one access
# entry per HTTP request. Disabled by default.
# audit:
#   enabled: false
#   path: stdout            # stdout | stderr | /path/to/audit.jsonl
#   include_text: false     # include prompt text in detection events
#                           # (canary token values are never logged either way)
#   access_log: false       # per-request access entries (hashed client key)
