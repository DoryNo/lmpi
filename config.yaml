# LMPI proxy configuration.
# Environment variables (LMPI_*) override these values:
#   LMPI_UPSTREAM_URL, LMPI_HOST, LMPI_PORT, LMPI_REQUEST_TIMEOUT,
#   LMPI_CONFIG_PATH (path to this file).
upstream_url: https://api.openai.com
host: 0.0.0.0
port: 8080
request_timeout: 300.0

# Fast path (stage 2): regex/heuristic jailbreak detection with noisy-OR
# scoring. Weights and thresholds are heuristics pending benchmark tuning.
# fast_path:
#   enabled: true
#   block_threshold: 0.75   # score >= this → HTTP 403
#   warn_threshold: 0.4     # score >= this < block → logged, forwarded

# Canary tokens (stage 3): HMAC canary injected into the system prompt and
# scanned for in responses to catch system prompt leakage. secret: HMAC key
# for token derivation — leave empty for an ephemeral per-process secret.
# canary:
#   enabled: true
#   action: redact          # redact (replace with [REDACTED]) | block (502)
#   secret: ""
#   add_missing_system: false  # add a system message when caller sent none
