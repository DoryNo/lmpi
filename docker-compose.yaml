services:
  lmpi:
    build: .
    image: lmpi:latest
    container_name: lmpi
    ports:
      - "8080:8080"
    environment:
      LMPI_HOST: 0.0.0.0
      LMPI_PORT: "8080"
      # Override with your LLM API base (OpenAI-compatible):
      LMPI_UPSTREAM_URL: ${LMPI_UPSTREAM_URL:-https://api.openai.com}
      # Optional: point at a mounted config file instead of env vars.
      # LMPI_CONFIG_PATH: /app/config.yaml
    restart: unless-stopped
